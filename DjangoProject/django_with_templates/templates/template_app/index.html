<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Mock</title>
  <link rel="stylesheet" href="./css/MenuDesign.css">
  <!-- Arama ikonu için FontAwesome (Opsiyonel) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  

  
  <main>
    <div class="logo">
      <span class="blue">G</span>
      <span class="red">o</span>
      <span class="yellow">o</span>
      <span class="blue">g</span>
      <span class="green">l</span>
      <span class="red">e</span>
    </div>

    
    <form action="https://www.google.com/search" method="GET" class="search-form">
    <!-- Arama Kutusu -->
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <!-- Google'a yönlendirmek için name="q" olması şarttır -->
      <input type="text" name="q" placeholder="" autofocus required>
      <i class="fa-solid fa-microphone mic-icon" title="Sesle arayın"></i>
    </div>

    <!-- Butonlar -->
    <div class="buttons">
      <button type="submit">Google'da Ara</button>
      <button type="submit" name="btnI" value="1">Kendimi Şanslı Hissediyorum</button>
    </div>
  </form>
  </main>

  <!-- Alt Bilgi (Footer) -->
  <footer>
    <div class="footer-top">
      <span>Türkiye</span>
    </div>
    <div class="footer-bottom">
      <div class="links-left">
        <a href="#">Hakkında</a>
        <a href="#">Reklam</a>
        <a href="#">İşletme</a>
        <a href="#">Arama Nasıl Çalışır?</a>
      </div>
      <div class="links-right">
        <a href="#">Gizlilik</a>
        <a href="#">Şartlar</a>
        <a href="#">Ayarlar</a>
      </div>
    </div>
  </footer>

</body>
</html>
